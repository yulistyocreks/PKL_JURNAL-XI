name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - name: Generate platform files
        run: flutter create --platforms=android .

      - name: Set NDK version
        run: |
          sed -i '/^android {/a\    ndkVersion = "27.0.12077973"' android/app/build.gradle.kts

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (split per ABI, ukuran lebih kecil)
        run: flutter build apk --release --split-per-abi

      - name: 
        run: |
          mkdir -p build/app/outputs/renamed
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/renamed/XI-JURNAL_PKL-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/renamed/XI-JURNAL_PKL-armv7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XI-JURNAL_PKL
          path: build/app/outputs/renamed/
